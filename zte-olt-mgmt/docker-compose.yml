services:
  zte-olt-mgmt:
    build: ./backend
    container_name: zte-olt-mgmt
    restart: unless-stopped
    network_mode: host
    command: uvicorn app.main:app --host 0.0.0.0 --port 8099
    environment:
      - DATABASE_URL=sqlite:////data/olt.db
      - SECRET_KEY=change-me-in-production
      - POLL_INTERVAL=60
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_CHAT_ID=
    volumes:
      - ./data:/data